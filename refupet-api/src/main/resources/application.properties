# =====================================================================
# RefuPet - configuración de Quarkus 3.8.2
# =====================================================================

# Puerto de ejecución de la API (igual que Streamflix)
quarkus.http.port=8080
quarkus.http.root-path=/

# ---------------------------------------------------------------------
# Conexión a la base de datos.
# Propiedades copiadas LITERALMENTE de
# streamflix-api/src/main/resources/application.properties (no modificar).
# ---------------------------------------------------------------------
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=test
quarkus.datasource.password=Curso20251
quarkus.datasource.jdbc.url=jdbc:mysql://54.221.17.1:3306/1152552

# ---------------------------------------------------------------------
# Versión mínima de la base de datos para Hibernate ORM.
# El servidor es MariaDB 10.2.38, pero Connector/J 8.3.0 lo informa como
# "MySQL 5.5.5-10.2.38-MariaDB" (getDatabaseMajorVersion=5, getDatabaseMinorVersion=5).
# Con el valor por defecto (8.0) Quarkus aborta el arranque al comprobar la versión.
# No altera URL, host, puerto, credenciales, motor ni driver.
# ---------------------------------------------------------------------
quarkus.datasource.db-version=5.5

# ---------------------------------------------------------------------
# Hibernate ORM: el esquema ya existe y SOLO se valida.
# Nunca usar update, create ni drop-and-create.
# ---------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=validate
# Ningún script SQL se carga automáticamente al arrancar
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=true
